<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mouseAI · 指哪解释哪的鼠标 Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efe4; --bg-2:#ebe5d6; --ink:#14110d; --ink-2:#423d33; --ink-3:#7a7264;
    --line:#1a16100f; --line-2:#1a16101a;
    --accent:#fbd02e; --accent-ink:#1a1610; --danger:#c84a2e; --safe:#2f8a5c;
    --term-bg:#0d0c0a; --term-bg-2:#18160f; --term-ink:#f1ebd7; --term-dim:#8a8268;
    --popup-bg:#1c1c1ef2; --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{background:var(--bg); color:var(--ink);
    font-family:"Geist","Noto Sans SC",-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
  body{background:
      radial-gradient(900px 600px at 85% -10%, #fbd02e22 0%, transparent 60%),
      radial-gradient(700px 500px at -10% 30%, #ffffff80 0%, transparent 60%),
      var(--bg);
    min-height:100vh; overflow-x:hidden;}
  .mono{font-family:"JetBrains Mono",ui-monospace,SF Mono,Menlo,monospace}
  .wrap{max-width:1240px; margin:0 auto; padding:0 28px}

  /* nav */
  nav.top{position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:#f4efe4cc; border-bottom:1px solid var(--line)}
  nav.top .inner{display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px; max-width:1240px; margin:0 auto}
  .brand{display:flex; align-items:center; gap:10px; font-weight:600}
  .brand .logo{width:28px; height:28px; background:var(--ink); color:var(--accent);
    border-radius:7px; display:grid; place-items:center}
  .brand .name{font-size:18px; letter-spacing:-.015em; font-weight:600}
  .brand .tag{font-size:11px; padding:2px 7px; border-radius:99px;
    background:var(--ink); color:var(--bg); font-weight:500; margin-left:4px}
  nav.top .links{display:flex; gap:24px; align-items:center}
  nav.top .links a{color:var(--ink-2); text-decoration:none; font-size:14px}
  nav.top .links a:hover{color:var(--ink)}
  /* 右上角「立即安装」CTA:品牌黄字(含 hover,避免被上面的通用 hover 规则盖成暗色) */
  nav.top .links a.btn,
  nav.top .links a.btn:hover{color:var(--accent); font-weight:700}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:99px;
    background:var(--ink); color:var(--bg); font-size:14px; font-weight:500;
    text-decoration:none; border:1px solid var(--ink); cursor:pointer;
    transition:transform .15s ease, background .15s ease}
  .btn:hover{transform:translateY(-1px)}
  .btn.ghost{background:transparent; color:var(--ink)}
  .btn.ghost:hover{background:var(--ink); color:var(--bg)}
  .btn.accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .lang{font-family:"JetBrains Mono"; font-size:12px; border:1px solid var(--line-2);
    background:#ffffff80; border-radius:99px; padding:5px 10px; cursor:pointer; color:var(--ink-2)}
  .lang b{color:var(--ink)}

  /* hero */
  section.hero{padding:60px 0 80px}
  .hero-grid{display:grid; grid-template-columns:1.05fr 1fr; gap:56px; align-items:center}
  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:500;
    letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2);
    padding:6px 12px; border:1px solid var(--line-2); border-radius:99px; background:#ffffff70}
  .eyebrow .dot{width:6px; height:6px; border-radius:99px; background:var(--safe)}
  h1.headline{font-size:clamp(38px,5.2vw,64px); line-height:1.06; letter-spacing:-.025em;
    font-weight:600; margin:22px 0 24px; text-wrap:balance}
  h1.headline .hl{background:linear-gradient(transparent 55%, var(--accent) 55%); padding:0 4px}
  h1.headline .strike{text-decoration:line-through; text-decoration-color:var(--danger);
    text-decoration-thickness:3px; color:var(--ink-3)}
  p.sub{font-size:19px; line-height:1.55; color:var(--ink-2); max-width:540px; margin-bottom:32px}
  .cta-row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
  .cta-meta{font-size:13px; color:var(--ink-3); display:flex; align-items:center; gap:6px; margin-left:4px}
  .kbd-inline{font-family:"JetBrains Mono"; font-size:11px; padding:2px 6px; border-radius:5px;
    background:#fff; border:1px solid var(--line-2); color:var(--ink)}

  /* terminal demo */
  .demo-shell{position:relative; border-radius:16px; background:var(--term-bg);
    box-shadow:0 30px 60px -20px rgba(20,17,13,.35), 0 0 0 1px rgba(20,17,13,.08);
    overflow:hidden; min-height:460px}
  .term-bar{display:flex; align-items:center; gap:8px; padding:11px 14px;
    background:var(--term-bg-2); border-bottom:1px solid #ffffff10}
  .term-bar .dots{display:flex; gap:6px}
  .term-bar .dots span{width:11px; height:11px; border-radius:99px}
  .term-bar .dots span:nth-child(1){background:#ed6a5e}
  .term-bar .dots span:nth-child(2){background:#f4be4f}
  .term-bar .dots span:nth-child(3){background:#61c554}
  .term-bar .title{color:var(--term-dim); font-family:"JetBrains Mono"; font-size:12px; margin-left:6px}
  .term-body{padding:18px 20px 24px; font-family:"JetBrains Mono"; font-size:13px; line-height:1.65;
    color:var(--term-ink); min-height:380px; position:relative}
  .term-body .line{white-space:pre-wrap}
  .term-body .prompt{color:#61c554}.term-body .dim{color:var(--term-dim)}
  .term-body .warn{color:#f4be4f}.term-body .err{color:#ed6a5e}.term-body .cc{color:#d6b6ff}
  .term-body .sel{background:#fbd02e44; color:var(--term-ink); border-radius:2px; box-shadow:0 0 0 1px #fbd02e88}
  .term-body .caret{display:inline-block; width:7px; height:14px; background:var(--term-ink);
    vertical-align:-2px; animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .popup{position:absolute; right:18px; bottom:18px; width:320px; background:var(--popup-bg);
    color:#f2f2f7; border-radius:14px; padding:16px 18px; border:.5px solid #ffffff22;
    backdrop-filter:blur(20px); box-shadow:0 20px 50px -10px rgba(0,0,0,.5);
    font-size:13px; line-height:1.55; opacity:0; transform:translateY(6px) scale(.98);
    transition:opacity .25s ease, transform .25s ease; pointer-events:none}
  .popup.show{opacity:1; transform:translateY(0) scale(1); pointer-events:auto}
  .popup .pop-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .popup .pop-title{font-size:11px; color:#ffffff80; font-family:"JetBrains Mono";
    text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:6px}
  .popup .pop-title .pulse{width:6px; height:6px; border-radius:99px; background:var(--accent);
    animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 #fbd02e80}50%{box-shadow:0 0 0 6px #fbd02e00}}
  .popup .pop-close{color:#ffffff60; font-size:11px; font-family:"JetBrains Mono"}
  .popup b{color:#ffe25e; font-weight:600}
  .popup code{color:#ffe25e; font-family:"JetBrains Mono"}
  .popup .verdict{margin-top:10px; padding-top:10px; border-top:1px solid #ffffff14;
    display:flex; align-items:center; gap:8px; font-size:12px}
  .popup .verdict.safe{color:#88e0b0}.popup .verdict.warn{color:#ffc560}.popup .verdict.deny{color:#ff8a78}
  .popup .esc{margin-top:12px; font-size:10px; color:#ffffff50; font-family:"JetBrains Mono"}
  .demo-controls{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
  .pill{background:#fff; border:1px solid var(--line-2); border-radius:99px; padding:8px 14px;
    font-size:13px; color:var(--ink-2); cursor:pointer; transition:all .15s ease;
    display:inline-flex; align-items:center; gap:8px}
  .pill .kbd{font-family:"JetBrains Mono"; font-size:10px; background:var(--bg-2);
    padding:2px 5px; border-radius:4px; color:var(--ink-2)}
  .pill:hover{border-color:var(--ink); color:var(--ink)}
  .pill.active{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .pill.active .kbd{background:#ffffff20; color:var(--bg)}
  .demo-hint{margin-top:10px; font-size:12px; color:var(--ink-3); display:flex; align-items:center; gap:6px}

  /* sections */
  .section{padding:80px 0; border-top:1px solid var(--line)}
  .section-head{margin-bottom:56px; max-width:800px}
  .section-head .label{font-family:"JetBrains Mono"; font-size:12px; color:var(--ink-3);
    text-transform:uppercase; letter-spacing:.08em; margin-bottom:14px}
  .section-head h2{font-weight:600; font-size:clamp(30px,4vw,46px); line-height:1.1;
    letter-spacing:-.02em; margin-bottom:16px; text-wrap:balance}
  .section-head h2 .mk{background:var(--accent); padding:0 6px; border-radius:4px}
  .section-head p{font-size:17px; color:var(--ink-2); line-height:1.5; max-width:620px}

  /* anti-positioning */
  .anti-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:28px}
  .anti-card{background:#fff; border:1px solid var(--line-2); border-radius:14px; padding:22px; position:relative}
  .anti-card .kill{position:absolute; top:14px; right:14px; width:28px; height:28px; border-radius:99px;
    background:#f7e3df; color:var(--danger); display:grid; place-items:center; font-size:14px}
  .anti-card h3{font-size:16px; font-weight:600; margin-bottom:8px; color:var(--ink-3);
    text-decoration:line-through; text-decoration-color:var(--danger); text-decoration-thickness:2px; padding-right:38px}
  .anti-card p{font-size:14px; line-height:1.55; color:var(--ink-3)}
  .answer-card{background:var(--ink); color:var(--bg); border-radius:14px; padding:28px;
    display:grid; grid-template-columns:auto 1fr auto; gap:24px; align-items:center}
  .answer-card .yes{width:44px; height:44px; border-radius:99px; background:var(--accent);
    color:var(--accent-ink); display:grid; place-items:center; font-size:22px; font-weight:600}
  .answer-card h3{font-size:22px; font-weight:600; margin-bottom:4px}
  .answer-card p{font-size:15px; color:#ffffffaa; line-height:1.5}
  .answer-card b{color:#fff}

  /* how it works */
  .hotkey-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
  .hotkey-card{background:#fff; border-radius:16px; border:1px solid var(--line-2); padding:28px;
    transition:transform .2s ease, box-shadow .2s ease}
  .hotkey-card:hover{transform:translateY(-2px); box-shadow:0 14px 30px -12px rgba(20,17,13,.12)}
  .hotkey{display:inline-flex; gap:4px; margin-bottom:18px}
  .key{font-family:"JetBrains Mono"; font-size:13px; font-weight:500; min-width:32px; height:32px;
    background:var(--bg); border:1px solid var(--line-2); border-bottom-width:2px; border-radius:7px;
    display:inline-flex; align-items:center; justify-content:center; padding:0 9px; color:var(--ink)}
  .key.accent{background:var(--accent); border-color:#c9a52280; color:var(--accent-ink)}
  .hotkey-card h3{font-size:19px; font-weight:600; margin-bottom:8px}
  .hotkey-card .desc{font-size:14px; line-height:1.6; color:var(--ink-2); margin-bottom:16px}
  .hotkey-card .example{background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-family:"JetBrains Mono"; font-size:12px; line-height:1.55; color:var(--ink-2)}
  .hotkey-card .example .arrow{color:var(--accent-ink); background:var(--accent); padding:0 4px; border-radius:3px}

  /* comparison */
  .comp{width:100%; border-collapse:separate; border-spacing:0; background:#fff; border-radius:16px;
    overflow:hidden; border:1px solid var(--line-2)}
  .comp th,.comp td{text-align:left; padding:14px 18px; font-size:14px; border-bottom:1px solid var(--line)}
  .comp thead th{background:var(--bg-2); font-weight:500; color:var(--ink-2); font-size:13px; vertical-align:bottom}
  .comp thead th.us{background:var(--ink); color:var(--bg); position:relative}
  .comp thead th.us::after{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--accent)}
  .comp tbody td{color:var(--ink-2)}
  .comp tbody td.row-label{font-weight:500; color:var(--ink)}
  .comp tbody td.us{background:#fbd02e15; color:var(--ink); font-weight:500}
  .comp tbody tr:last-child td{border-bottom:none}
  .comp .mark{font-family:"JetBrains Mono"; font-size:16px}
  .comp .mark.yes{color:var(--safe)}.comp .mark.no{color:var(--ink-3); opacity:.5}.comp .mark.partial{color:#c9931a}

  /* install */
  .install-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px}
  .step{background:#fff; border:1px solid var(--line-2); border-radius:14px; padding:24px 20px; position:relative}
  .step .num{font-family:"JetBrains Mono"; font-size:12px; color:var(--ink-3); margin-bottom:12px}
  .step h4{font-size:16px; font-weight:600; margin-bottom:6px}
  .step p{font-size:13px; color:var(--ink-2); line-height:1.55}
  .step .cmd{margin-top:10px; font-family:"JetBrains Mono"; font-size:11px; background:var(--bg);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; color:var(--ink);
    overflow-x:auto; white-space:nowrap}
  .privacy-banner{background:var(--ink); color:var(--bg); border-radius:16px; padding:32px;
    display:flex; align-items:center; gap:24px; flex-wrap:wrap}
  .privacy-banner .icon{width:56px; height:56px; border-radius:14px; background:var(--accent);
    color:var(--accent-ink); display:grid; place-items:center; flex-shrink:0}
  .privacy-banner h3{font-size:20px; font-weight:600; margin-bottom:4px}
  .privacy-banner p{font-size:14px; color:#ffffffaa; line-height:1.55; max-width:620px}
  .privacy-banner .stat{display:flex; gap:28px; margin-left:auto}
  .privacy-banner .stat div{text-align:right}
  .privacy-banner .stat .n{font-family:"JetBrains Mono"; font-size:24px; font-weight:600; color:var(--accent)}
  .privacy-banner .stat .l{font-size:11px; color:#ffffff80}

  footer{padding:60px 0 40px; border-top:1px solid var(--line); margin-top:80px}
  footer .inner{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:24px}
  footer p{font-size:13px; color:var(--ink-3); line-height:1.6; max-width:380px}
  footer .legal{font-size:12px; color:var(--ink-3); font-family:"JetBrains Mono"}
  footer .legal a{color:var(--ink-2)}

  @media(max-width:960px){
    .hero-grid{grid-template-columns:1fr}
    .anti-grid,.hotkey-grid{grid-template-columns:1fr}
    .install-grid{grid-template-columns:1fr 1fr}
    .answer-card{grid-template-columns:auto 1fr}
    .privacy-banner .stat{margin-left:0}
    nav.top .links a:not(.btn){display:none}
  }
</style>
</head>
<body>

<nav class="top">
  <div class="inner">
    <div class="brand">
      <div class="logo">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 2.5 L3.5 11 L6 9 L7.5 12.5 L9 12 L7.5 8.5 L11 8.5 Z" fill="currentColor" stroke="currentColor" stroke-width="0.7" stroke-linejoin="round"/></svg>
      </div>
      <div class="name">mouseAI</div>
      <span class="tag mono">v0 · 看懂</span>
    </div>
    <div class="links">
      <a href="#why" data-i18n="nav_why"></a>
      <a href="#how" data-i18n="nav_how"></a>
      <a href="#compare" data-i18n="nav_compare"></a>
      <a href="#install" data-i18n="nav_install"></a>
      <button class="lang" id="langToggle"></button>
      <a class="btn" href="#install" data-i18n="nav_cta"></a>
    </div>
  </div>
</nav>

<!-- HERO -->
<section class="hero"><div class="wrap"><div class="hero-grid">
  <div>
    <span class="eyebrow"><span class="dot"></span><span data-i18n="hero_eyebrow"></span></span>
    <h1 class="headline" data-i18n="hero_h1"></h1>
    <p class="sub" data-i18n="hero_sub"></p>
    <div class="cta-row">
      <a class="btn accent" id="ctaCc" href="#install" data-i18n="hero_cta1"></a>
      <a class="btn ghost" href="#how" data-i18n="hero_cta2"></a>
      <span class="cta-meta" data-i18n="hero_meta"></span>
    </div>
  </div>
  <div>
    <div class="demo-shell">
      <div class="term-bar">
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="title" id="termTitle"></div>
      </div>
      <div class="term-body" id="termBody"></div>
    </div>
    <div class="demo-controls" id="demoControls"></div>
    <div class="demo-hint" id="demoHint"></div>
  </div>
</div></div></section>

<!-- WHY / anti-positioning -->
<section class="section" id="why"><div class="wrap">
  <div class="section-head">
    <div class="label" data-i18n="why_label"></div>
    <h2 data-i18n="why_h2"></h2>
    <p data-i18n="why_p"></p>
  </div>
  <div class="anti-grid" id="antiGrid"></div>
  <div class="answer-card">
    <div class="yes">✓</div>
    <div>
      <h3 data-i18n="answer_h"></h3>
      <p data-i18n="answer_p"></p>
    </div>
    <a href="#how" class="btn accent" data-i18n="answer_cta"></a>
  </div>
</div></section>

<!-- HOW -->
<section class="section" id="how" style="background:#ffffff80"><div class="wrap">
  <div class="section-head">
    <div class="label" data-i18n="how_label"></div>
    <h2 data-i18n="how_h2"></h2>
    <p data-i18n="how_p"></p>
  </div>
  <div class="hotkey-grid" id="hotkeyGrid"></div>
</div></section>

<!-- COMPARE -->
<section class="section" id="compare"><div class="wrap">
  <div class="section-head">
    <div class="label" data-i18n="cmp_label"></div>
    <h2 data-i18n="cmp_h2"></h2>
    <p data-i18n="cmp_p"></p>
  </div>
  <table class="comp" id="compTable"></table>
</div></section>

<!-- INSTALL -->
<section class="section" id="install" style="background:#ffffff80"><div class="wrap">
  <div class="section-head">
    <div class="label" data-i18n="ins_label"></div>
    <h2 data-i18n="ins_h2"></h2>
    <p data-i18n="ins_p"></p>
  </div>
  <div class="install-grid" id="installGrid"></div>
  <div class="privacy-banner">
    <div class="icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
    <div>
      <h3 data-i18n="priv_h"></h3>
      <p data-i18n="priv_p"></p>
    </div>
    <div class="stat">
      <div><div class="n">0</div><div class="l" data-i18n="priv_s1"></div></div>
      <div><div class="n">0</div><div class="l" data-i18n="priv_s2"></div></div>
      <div><div class="n">0</div><div class="l" data-i18n="priv_s3"></div></div>
    </div>
  </div>
</div></section>

<footer><div class="wrap inner">
  <div>
    <div class="brand" style="margin-bottom:12px">
      <div class="logo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 2.5 L3.5 11 L6 9 L7.5 12.5 L9 12 L7.5 8.5 L11 8.5 Z" fill="currentColor" stroke="currentColor" stroke-width="0.7" stroke-linejoin="round"/></svg></div>
      <div class="name">mouseAI</div>
    </div>
    <p data-i18n="foot_p"></p>
  </div>
  <div class="legal" data-i18n="foot_legal"></div>
</div></footer>

<script>
const I18N = {
  cn: {
    nav_why:"为什么", nav_how:"怎么用", nav_compare:"对比", nav_install:"安装", nav_cta:"立即安装 →",
    hero_eyebrow:"v0 · 看懂 · 已开放试用",
    hero_h1:'在终端里<span class="hl">指哪解释哪</span>。<br>不用切窗口、<br><span class="strike">不用稀里糊涂点继续</span>。',
    hero_sub:'给不懂技术的人用。在 Claude Code 里划选看不懂的东西、按下快捷键,<b>几秒内大白话讲清</b>;cc 要动手时,告诉你它要干嘛、有没有风险、该不该放行。<b>它还有记忆——记住你常卡的地方,帮你总结学到了什么。</b>',

let lang = (navigator.language||"").toLowerCase().startsWith("en") ? "en" : "cn";
let scenario = "explain";
let triggered = false;
let trigTimer = null;

const $ = (s)=>document.querySelector(s);
const T = ()=>I18N[lang];

function escSel(txt, sel, on){
  const i = txt.indexOf(sel);
  if(i<0) return escHtml(txt);
  return escHtml(txt.slice(0,i)) + `<span class="${on?'sel':''}">${escHtml(sel)}</span>` + escHtml(txt.slice(i+sel.length));
}
function escHtml(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function renderDemo(){
  const sc = T().scenarios[scenario];
  $("#termTitle").textContent = "~ / claude-code · " + sc.label;
  // body
  let html = "";
  sc.lines.forEach((ln,idx)=>{
    const inner = ln.sel ? escSel(ln.t, ln.sel, triggered) : (ln.t ? escHtml(ln.t) : "&nbsp;");
    html += `<div class="line"><span class="${ln.c||''}">${inner}</span>${idx===sc.lines.length-1?'<span class="caret"></span>':''}</div>`;
  });
  // popup
  const v = sc.verdict ? `<div class="verdict ${sc.verdict.kind}">${sc.verdict.t}</div>` : "";
  html += `<div class="popup ${triggered?'show':''}">
    <div class="pop-head"><div class="pop-title"><span class="pulse"></span>${sc.title}</div><div class="pop-close">${T().popClose}</div></div>
    <div>${sc.body}</div>${v}
    <div class="esc">${T().esc}</div></div>`;
  $("#termBody").innerHTML = html;
  $("#demoHint").textContent = "→ " + sc.hint;
}

function renderControls(){
  const sc = T().scenarios;
  let html = "";
  Object.keys(sc).forEach(k=>{
    html += `<button class="pill ${k===scenario?'active':''}" data-sc="${k}">${sc[k].label}<span class="kbd">${sc[k].kbd}</span></button>`;
  });
  html += `<button class="pill" id="retrig" style="margin-left:auto">${triggered?T().hideTip:T().retrigger}</button>`;
  $("#demoControls").innerHTML = html;
  document.querySelectorAll("#demoControls .pill[data-sc]").forEach(b=>{
    b.onclick = ()=>{ scenario = b.dataset.sc; trigger(); };
  });
  $("#retrig").onclick = ()=>{ triggered=!triggered; renderDemo(); renderControls(); };
}

function trigger(){
  triggered = false; renderDemo(); renderControls();
  clearTimeout(trigTimer);
  trigTimer = setTimeout(()=>{ triggered=true; renderDemo(); renderControls(); }, 650);
}

function applyLang(){
  document.documentElement.lang = (lang==="en"?"en":"zh-CN");
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v = T()[el.getAttribute("data-i18n")];
    if(v!=null) el.innerHTML = v;
  });
  // anti cards
  $("#antiGrid").innerHTML = T().anti.map(a=>
    `<div class="anti-card"><div class="kill">✕</div><h3>${a.h}</h3><p>${a.p}</p></div>`).join("");
  // hotkey cards
  $("#hotkeyGrid").innerHTML = T().hot.map(c=>{
    const keys = c.keys.map((k,j)=>`<span class="key ${j===c.keys.length-1?'accent':''}">${k}</span>`).join("");
    return `<div class="hotkey-card"><div class="hotkey">${keys}</div><h3>${c.h}</h3><div class="desc">${c.d}</div><div class="example">${c.ex}</div></div>`;
  }).join("");
  // comparison
  const mark = (v)=> v==="yes"?'<span class="mark yes">●</span>': v==="no"?'<span class="mark no">○</span>': v==="partial"?'<span class="mark partial">◐</span>': v;
  const cols = T().cmp_cols, rows = T().cmp_rows;
  let ct = "<thead><tr>" + cols.map((c,i)=>`<th class="${i===cols.length-1?'us':''}">${c}</th>`).join("") + "</tr></thead><tbody>";
  ct += rows.map(r=>"<tr>"+r.map((cell,j)=>`<td class="${j===0?'row-label':''} ${j===r.length-1?'us':''}">${mark(cell)}</td>`).join("")+"</tr>").join("");
  ct += "</tbody>";
  $("#compTable").innerHTML = ct;
  // install
  $("#installGrid").innerHTML = T().ins.map(s=>
    `<div class="step"><div class="num">STEP ${s.n}</div><h4>${s.h}</h4><p>${s.p}</p><div class="cmd">${s.cmd}</div></div>`).join("");
  // lang toggle label
  $("#langToggle").innerHTML = lang==="cn" ? '<b>中</b> / EN' : '中 / <b>EN</b>';
  renderControls(); renderDemo();
}

$("#langToggle").onclick = ()=>{ lang = lang==="cn"?"en":"cn"; applyLang(); };
applyLang();
trigger();

    setTimeout(()=>{ cta.innerHTML = T().hero_cta1; }, 2400);
    const ins = document.getElementById("install");
    if(ins) ins.scrollIntoView({behavior:"smooth"});
  });
})();
